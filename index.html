<script>
const SUPABASE_URL = "https://yjlrhjsllyitlcuqkaik.supabase.co";
const SUPABASE_KEY = "sb_publishable_uPqbAnmLLdDSeFOq1z6X9g_MHHBqeYC";

const companyGrid = document.getElementById("companyGrid");
const searchForm = document.getElementById("companySearch");
const searchInput = document.getElementById("searchInput");
const emptyMessage = document.getElementById("emptyMessage");

let allCompanies = [];

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  })[character]);
}

function renderCompanies(companies) {
  companyGrid.innerHTML = "";

  if (companies.length === 0) {
    emptyMessage.style.display = "block";
    return;
  }

  emptyMessage.style.display = "none";

  companies.forEach(company => {
    const card = document.createElement("a");
    card.className = "card company";

    card.href = `company.html?code=${encodeURIComponent(company.stock_code)}`;

    const searchable = [
      company.stock_code,
      company.name,
      company.sector,
      company.industry,
      company.market
    ].join(" ").toLowerCase();

    card.dataset.search = searchable;

    card.innerHTML = `
      <div class="card-top">
        <span class="stock-code">
          ${escapeHTML(company.stock_code)} · ${escapeHTML(company.market)}
        </span>
        <span class="tag">
          ${escapeHTML(company.sector || "COMPANY")}
        </span>
      </div>

      <h3>${escapeHTML(company.name)}</h3>

      <p>${escapeHTML(company.industry || company.sector || "Bursa Malaysia")}</p>

      <div class="card-bottom">
        <span>Research coverage</span>
        <span class="status">Available</span>
      </div>
    `;

    companyGrid.appendChild(card);
  });
}

async function loadCompanies() {
  companyGrid.innerHTML = `
    <p style="color:#91a4b3;padding:20px;">
      Loading companies from BLX database...
    </p>
  `;

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/companies?select=id,stock_code,name,market,sector,industry&is_active=eq.true&order=stock_code.asc`,
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error);
    }

    allCompanies = await response.json();

    renderCompanies(allCompanies);

  } catch (error) {
    console.error("BLX Supabase connection error:", error);

    companyGrid.innerHTML = `
      <p style="color:#f87171;padding:20px;">
        Unable to load companies. Please check the Supabase connection and RLS policies.
      </p>
    `;
  }
}

searchForm.addEventListener("submit", function(event) {
  event.preventDefault();

  const query = searchInput.value.trim().toLowerCase();

  const filteredCompanies = allCompanies.filter(company => {
    const searchable = [
      company.stock_code,
      company.name,
      company.sector,
      company.industry,
      company.market
    ].join(" ").toLowerCase();

    return searchable.includes(query);
  });

  renderCompanies(filteredCompanies);

  document.getElementById("companies").scrollIntoView({
    behavior: "smooth"
  });
});

searchInput.addEventListener("input", function() {
  const query = searchInput.value.trim().toLowerCase();

  const filteredCompanies = allCompanies.filter(company => {
    const searchable = [
      company.stock_code,
      company.name,
      company.sector,
      company.industry,
      company.market
    ].join(" ").toLowerCase();

    return searchable.includes(query);
  });

  renderCompanies(filteredCompanies);
});

loadCompanies();
</script>
